[workspace]
resolver = "2"
members = ["crates/crm-core", "crates/crm-server", "crates/crm-connect", "crates/crm-desktop"]
# Приложение Tauri собирается отдельно (нужен WebView): CI-задача desktop на Windows.
default-members = ["crates/crm-core", "crates/crm-server", "crates/crm-connect"]

[workspace.package]
edition = "2021"
version = "0.2.4"
license = "UNLICENSED"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Хеширование паролей в отладочной сборке иначе идёт секундами.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
