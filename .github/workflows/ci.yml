name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Ядро и сервер (default-members); приложение Tauri — в задаче desktop.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  windows-service:
    # Настоящая установка службы на Windows: права, брандмауэр, HTTPS, перезапуск, удаление.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p crm-server
      - name: Установка, проверка и удаление службы
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:GITHUB_WORKSPACE\target\release\crm-server.exe"
          trap {
            Write-Host "===== папка данных ====="
            Get-ChildItem C:\ProgramData\CRM -Recurse -Force -ErrorAction Continue | Select-Object FullName, Length | Out-Host
            Write-Host "===== last-error.txt ====="
            Get-Content C:\ProgramData\CRM\last-error.txt -ErrorAction Continue | Out-Host
            Write-Host "===== журнал сервера ====="
            Get-ChildItem C:\ProgramData\CRM\logs -File -ErrorAction Continue | ForEach-Object { Get-Content $_.FullName | Out-Host }
            Write-Host "===== журнал Windows (Service Control Manager) ====="
            Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'} -MaxEvents 15 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
            Write-Host "===== порт 8443 ====="
            netstat -ano | Select-String ':8443'
            break
          }
          function Health {
            for ($i = 0; $i -lt 40; $i++) {
              $r = curl.exe -s --ssl-no-revoke --cacert C:\ProgramData\CRM\data\tls\ca.crt https://localhost:8443/api/health
              if ($r -match '"status":"ok"') { return $r }
              Start-Sleep -Milliseconds 500
            }
            Get-ChildItem C:\ProgramData\CRM -Recurse | Format-Table FullName
            Get-Content C:\ProgramData\CRM\logs\* -ErrorAction SilentlyContinue
            throw "сервер не отвечает по HTTPS"
          }

          & $exe service install; if ($LASTEXITCODE) { throw "install" }
          & $exe service status
          Write-Host "health: $(Health)"

          $svc = Get-CimInstance Win32_Service -Filter "Name='CRMServer'"
          if ($svc.StartName -ne 'NT SERVICE\CRMServer') { throw "учётная запись: $($svc.StartName)" }
          if ($svc.StartMode -ne 'Auto') { throw "автозапуск: $($svc.StartMode)" }
          $rule = Get-NetFirewallRule -DisplayName 'CRM Server'
          if ("$($rule.Profile)" -notmatch 'Private' -or "$($rule.Profile)" -match 'Public') { throw "профиль брандмауэра: $($rule.Profile)" }
          $acl = (Get-Acl C:\ProgramData\CRM).Access | ForEach-Object { "$($_.IdentityReference)" }
          if ($acl -contains 'BUILTIN\Users') { throw "у обычных пользователей есть доступ к данным" }

          & $exe service install; if ($LASTEXITCODE) { throw "повторная установка" }
          & $exe service restart; if ($LASTEXITCODE) { throw "restart" }
          Write-Host "после перезапуска: $(Health)"

          & $exe service uninstall; if ($LASTEXITCODE) { throw "uninstall" }
          if (Get-Service CRMServer -ErrorAction SilentlyContinue) { throw "служба не удалена" }
          if (Get-NetFirewallRule -DisplayName 'CRM Server' -ErrorAction SilentlyContinue) { throw "правило брандмауэра осталось" }
          if (-not (Test-Path C:\ProgramData\CRM\data\crm.db)) { throw "данные удалены, а не должны" }

          # Служба удалена старым деинсталлятором (без отметки), база осталась — установщик возвращает её.
          & $exe service unpark; if ($LASTEXITCODE) { throw "unpark без отметки" }
          if ((Get-Service CRMServer).Status -ne 'Running') { throw "служба не вернулась" }
          Write-Host "вернулась: $(Health)"
          # Деинсталлятор запоминает службу и её автозапуск, установщик возвращает как было.
          & $exe service autostart-off; if ($LASTEXITCODE) { throw "autostart-off" }
          & $exe service park; if ($LASTEXITCODE) { throw "park" }
          if (Get-Service CRMServer -ErrorAction SilentlyContinue) { throw "park не удалил службу" }
          & $exe service unpark; if ($LASTEXITCODE) { throw "unpark" }
          $mode = (Get-CimInstance Win32_Service -Filter "Name='CRMServer'").StartMode
          if ($mode -ne 'Manual') { throw "автозапуск не сохранился: $mode" }
          if (Test-Path C:\ProgramData\CRM\service.parked) { throw "отметка осталась" }
          & $exe service unpark; if ($LASTEXITCODE) { throw "повторный unpark" }
          Write-Host "после park/unpark: $(Health)"
          & $exe service uninstall; if ($LASTEXITCODE) { throw "uninstall 2" }
          Write-Host "OK"
  desktop:
    # Приложение в трее + установщик CRM-Setup.exe, затем настоящая установка/обновление/удаление.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Сборка веб-интерфейса (встраивается в crm-server)
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo build --release -p crm-server
      - name: crm-server рядом с приложением (sidecar)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force crates/crm-desktop/binaries | Out-Null
          Copy-Item target/release/crm-server.exe crates/crm-desktop/binaries/crm-server-x86_64-pc-windows-msvc.exe
      - run: cargo clippy -p crm-desktop --all-targets -- -D warnings
      - run: cargo test -p crm-desktop
      - name: Сборка установщика
        working-directory: crates/crm-desktop
        run: npx -y @tauri-apps/cli@2 build
      - name: Установка, обновление и удаление
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $dir = 'C:\Program Files\CRM'
          function Health {
            for ($i = 0; $i -lt 60; $i++) {
              $r = curl.exe -s --ssl-no-revoke --cacert C:\ProgramData\CRM\data\tls\ca.crt https://localhost:8443/api/health
              if ($r -match '"status":"ok"') { return $r }
              Start-Sleep -Milliseconds 500
            }
            Get-Content C:\ProgramData\CRM\logs\* -ErrorAction SilentlyContinue
            throw "сервер не отвечает"
          }
          function WaitUntil($what, [scriptblock]$cond) {
            for ($i = 0; $i -lt 120; $i++) { if (& $cond) { return }; Start-Sleep -Milliseconds 500 }
            throw "не дождался: $what"
          }

          Write-Host "Установщик: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) МБ)"
          Start-Process $setup -ArgumentList '/S' -Wait
          foreach ($f in 'CRM.exe', 'crm-server.exe', 'uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { Get-ChildItem $dir; throw "после установки нет $f" }
          }
          & "$dir\crm-server.exe" service install; if ($LASTEXITCODE) { throw "service install" }
          Write-Host "работает: $(Health)"

          # Самопроверка окна программы: CRM в окне (WebView2) и кнопка «Остановить сервер» — обязательны.
          $report = "$env:RUNNER_TEMP\selftest.txt"
          $env:CRM_SELFTEST_OUT = $report
          $app = Start-Process "$dir\CRM.exe" -PassThru
          for ($i = 0; $i -lt 180; $i++) {
            if ((Test-Path $report) -and (Select-String -Path $report -Pattern '^DONE' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Remove-Item Env:CRM_SELFTEST_OUT
          Write-Host "===== отчёт самопроверки ====="
          if (Test-Path $report) { Get-Content $report | Out-Host } else { Write-Warning "отчёта нет" }
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          $page = if (Test-Path $report) { Select-String -Path $report -Pattern '^PAGE ' | Select-Object -First 1 } else { $null }
          if (-not $page -or $page.Line -notmatch '"root_children":[1-9]' -or $page.Line -notmatch '"errors":\[\]') { throw "CRM в окне программы не отрисовалась" }
          if (-not (Select-String -Path $report -Pattern 'STOP ok service=Stopped' -Quiet -ErrorAction SilentlyContinue)) { throw "«Остановить сервер» не остановил службу" }
          # Панель убирает ?confirm=stop из адреса после показа окна подтверждения.
          if (-not (Select-String -Path $report -Pattern 'TRAY stop' -Context 0,4 | Out-String | Select-String 'LOAD Started http://tauri\.localhost/.*confirm=stop' -Quiet)) { throw "трей «Остановить сервер» не вернул окно на панель" }
          if (-not (Select-String -Path $report -Pattern 'TRAY stop' -Context 0,5 | Out-String | Select-String 'LOAD Finished http://tauri\.localhost/' -Quiet)) { throw "панель после «Остановить сервер» не загрузилась" }
          if (-not (Select-String -Path $report -Pattern 'TRAY panel' -Context 0,2 | Out-String | Select-String 'NAVIGATE http://tauri\.localhost/' -Quiet)) { throw "трей «Панель управления» не открыл панель" }
          # «Скачать» на странице CRM (файл из памяти страницы, как резервные коды) сохраняет файл в «Загрузки».
          $dl = Select-String -Path $report -Pattern '^DOWNLOAD done ok=true path=(.*crm-selftest[^\\]*\.txt)$' | Select-Object -First 1
          if (-not $dl) { throw "скачивание со страницы CRM не сработало" }
          $file = $dl.Matches[0].Groups[1].Value
          if ((Get-Content $file -Raw) -ne 'CRM selftest') { throw "скачанный файл пустой или чужой: $file" }
          # Кнопки страницы, которым нужна программа, доходят до неё.
          if (-not (Select-String -Path $report -Pattern '^BRIDGE ping$' -Quiet)) { throw "страница не достучалась до программы" }
          Write-Host "служба: $((Get-Service CRMServer).Status)"
          if ((Get-Service CRMServer).Status -ne 'Running') { & "$dir\crm-server.exe" service start; if ($LASTEXITCODE) { throw "service start" } }
          Write-Host "снова работает: $(Health)"

          # Обновление поверх: служба останавливается на время замены файлов и снова запускается.
          Start-Process $setup -ArgumentList '/S' -Wait
          WaitUntil 'служба после обновления' { (Get-Service CRMServer -ErrorAction SilentlyContinue).Status -eq 'Running' }
          Write-Host "после обновления: $(Health)"

          # Обновление с «Удалить перед установкой» (выбрано по умолчанию в окне установщика):
          # установщик запускает старый деинсталлятор без /UPDATE. Служба, её автозапуск и данные остаются.
          & "$dir\crm-server.exe" service autostart-off; if ($LASTEXITCODE) { throw "autostart-off" }
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait
          Remove-Item "$dir\uninstall.exe" -ErrorAction SilentlyContinue
          Start-Process $setup -ArgumentList '/S' -Wait
          WaitUntil 'служба после обновления с удалением' { (Get-Service CRMServer -ErrorAction SilentlyContinue).Status -eq 'Running' }
          $mode = (Get-CimInstance Win32_Service -Filter "Name='CRMServer'").StartMode
          if ($mode -ne 'Manual') { throw "автозапуск не сохранился: $mode" }
          Write-Host "после обновления с удалением: $(Health)"
          & "$dir\crm-server.exe" service autostart-on; if ($LASTEXITCODE) { throw "autostart-on" }

          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          WaitUntil 'удаление службы' { -not (Get-Service CRMServer -ErrorAction SilentlyContinue) }
          WaitUntil 'удаление программы' { -not (Test-Path "$dir\CRM.exe") }
          if (-not (Test-Path C:\ProgramData\CRM\data\crm.db)) { throw "данные удалены без согласия" }
          # Повторная установка после удаления возвращает сервер с прежними данными.
          Start-Process $setup -ArgumentList '/S' -Wait
          WaitUntil 'служба после повторной установки' { (Get-Service CRMServer -ErrorAction SilentlyContinue).Status -eq 'Running' }
          Write-Host "после повторной установки: $(Health)"
          Write-Host "OK"
      - uses: actions/upload-artifact@v4
        with:
          name: CRM-Setup
          path: target/release/bundle/nsis/*-setup.exe
  release:
    # Тег vX.Y.Z или X.Y.Z → релиз на GitHub с установщиком.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rust, audit, windows-service, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CRM-Setup
      - uses: softprops/action-gh-release@v2
        with:
          files: '*-setup.exe'
          generate_release_notes: true
          # Пока версия 0.x — релиз помечается как предварительный.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || startsWith(github.ref_name, '0.') }}
