name: android
# Приложение CRM для Android (ветка android, план — docs/ANDROID.md).
on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/crm-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ключ подписи
        # Настоящий ключ лежит в секретах репозитория. Пока их нет, сборка подписывается
        # временным ключом: приложение ставится, но обновить его поверх нельзя.
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64=$KEYSTORE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "APK_NAME=CRM-Android" >> "$GITHUB_ENV"
          else
            pw=$(openssl rand -hex 16)
            openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=CRM test" -keyout k.pem -out c.pem
            openssl pkcs12 -export -name crm -inkey k.pem -in c.pem -out t.p12 -passout "pass:$pw"
            echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 t.p12)" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "APK_NAME=CRM-Android-test" >> "$GITHUB_ENV"
            rm k.pem c.pem t.p12
          fi
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Проект Android
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm install --no-audit --no-fund
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- icon ../crm-desktop/icons/source.png
          ./android/overlay.sh
      - name: Сборка APK
        run: |
          npm run tauri -- android build --apk --ci --target aarch64 --target armv7 --target x86_64
          find gen/android/app/build/outputs/apk -name '*.apk' -exec ls -la {} \;
          mkdir -p out && cp "$(find gen/android/app/build/outputs/apk -name '*.apk' | head -1)" out/CRM.apk
        env:
          ANDROID_KEY_ALIAS: crm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: crates/crm-mobile/out/CRM.apk
      - name: KVM для эмулятора
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запуск на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: crates/crm-mobile
          script: ./android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: crates/crm-mobile/out/smoke
