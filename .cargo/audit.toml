# Исключения cargo audit. Каждое — с обоснованием и условием снятия.
[advisories]
ignore = [
    # RUSTSEC-2026-0459 (SQLite < 3.54, libsqlite3-sys < 0.39): утечка памяти процесса,
    # если открыть БД вместе с ПОДЛОЖЕННЫМ файлом -wal другого размера страницы.
    # Наша БД лежит в папке 0700 (пишет только сервер). Восстановление из бэкапа/пакета
    # обязано удалять чужие -wal/-shm до открытия (ТЗ §5). sqlx 0.9.0 пока допускает
    # только libsqlite3-sys < 0.38 — снять исключение, как только sqlx поддержит >= 0.39.
    "RUSTSEC-2026-0459",
]
