[package]
name = "crm-server"
description = "Сервер CRM: REST API, WebSocket, SQLite, фоновые воркеры"
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
crm-core = { path = "../crm-core" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml = "0.8"
chrono.workspace = true
chrono-tz.workspace = true
argon2 = "0.5"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
if-addrs = "0.15"
gethostname = "1"
x509-parser = "0.18"
rust-embed = { version = "8", features = ["mime-guess"] }
zstd = "0.13"
fs4 = "1"
rpassword = "7"
hyper-util = { version = "0.1", features = ["tokio"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
csv = "1.4.0"
encoding_rs = "0.8.44"
calamine = "0.38.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
x25519-dalek = "3.0.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
